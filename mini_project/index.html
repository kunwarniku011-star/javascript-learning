<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student result calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>STUDENT RESULT CALCULATOR</h1>
        <p>ENTER YOUR DETAILS BELOW</p>
        <label for="student name">STUDENT NAME:</label>
        <input type="text" id="student name" placeholder="Enter your name">
        <br>
        <label for="student id">STUDENT ID:</label>
        <input type="number" id="student id" placeholder="Enter your id">
        <br>
        <label for="maths">MATHS:</label>
        <input TYPE="number" id="maths" placeholder="Enter your maths marks">
        <br>
        <label for="science"> SCIENCE:</label>
        <input type="number" id="science" placeholder="Enter your science marks">
        <br>
        <label for="english">ENGLISH:</label>
        <input type="number" id="english" placeholder="Enter your english marks">
        <br>
        <label for="computer">COMPUTER:</label>
        <input type="number" id="computer" placeholder="Enter your computer marks">
        <br><br>
        <button type="button" id="calculatebtn">CACULATE RESULT</button>
        <div id="result"></div>
        <script src="script.js"></script>
    </div>
</body>
</html>
